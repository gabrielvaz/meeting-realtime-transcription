name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build estático
        env:
          STATIC_EXPORT: "1"
          # Project page: https://<usuário>.github.io/<repo>/
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      # Sem isso o Jekyll do Pages ignora o diretório _next e a página sobe sem CSS.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
